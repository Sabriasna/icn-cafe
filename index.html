<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICN Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#FF5A0A;--o2:#FF7A2E;--soft:#FFF3EB;--soft2:#FFE4D3;--ink:#111;--mut:#7a7a7a;--line:#EDEDED;--green:#1E9E55;--gsoft:#E6F6EC;--yellow:#F2C230}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#E7E7EC;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
.phone{position:relative;width:400px;height:min(860px,96vh);background:#fff;border-radius:54px;border:12px solid #111;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column}
@media(max-width:500px){body{display:block;background:#fff}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.island{display:none}}
.status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;font-weight:700;font-size:15px;flex:none;position:relative}
.island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:112px;height:31px;background:#111;border-radius:20px}
.sicons{display:flex;gap:6px;align-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:#fff;padding:9px 0 20px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#666;font:500 13px Inter,sans-serif;position:relative}
.tab.on{color:var(--o)}
.tab svg{width:27px;height:27px}
.badge{position:absolute;top:-8px;left:calc(50% + 4px);background:var(--o);color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
svg{display:block}
/* header */
.hdr{display:flex;align-items:center;padding:4px 0 16px}
.logo{background:none;border:0;padding:0;text-align:left}
.icn{font-family:'Archivo Black',sans-serif;font-size:42px;line-height:.85;letter-spacing:-2.5px;display:flex;align-items:flex-end}
.icn .dot{width:12px;height:12px;border-radius:50%;background:var(--o);margin:0 0 3px 3px}
.bs{font-size:7.5px;font-weight:800;letter-spacing:2.6px;margin-top:5px}
.bars{display:flex;gap:3px;margin-top:6px}.bars i{height:3px;width:56px;background:#111}.bars i:nth-child(2){width:24px;background:var(--yellow)}.bars i:nth-child(3){width:24px;background:var(--o)}
.brand{margin-left:auto;margin-right:10px;line-height:1.15}.brand b{font-family:'Archivo Black',sans-serif;font-size:15px;display:block;letter-spacing:.2px}.brand span{color:var(--o);font-weight:800;font-size:10.5px;letter-spacing:.4px}
.avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--o);background:#fff;color:var(--o);display:grid;place-items:center;flex:none}
.avatar svg{width:24px;height:24px}
h1.t{font-family:'Archivo Black',sans-serif;font-size:28px;margin:4px 0 16px;letter-spacing:-.5px;line-height:1.1}
.back{display:flex;align-items:center;gap:8px;margin:4px 0 16px}.back h1.t{margin:0}
.backbtn{background:none;border:0;padding:4px;margin-left:-6px}.backbtn svg{width:28px;height:28px}
/* hero */
.hero{background:var(--o);border-radius:20px;display:flex;overflow:hidden;color:#fff;min-height:160px;position:relative;cursor:pointer;border:0;width:100%;text-align:left;padding:0}
.hero .txt{padding:20px 0 18px 18px;flex:1.25;z-index:2}
.hero h2{font-family:'Archivo Black',sans-serif;font-size:23px;line-height:1.12;margin:0 0 10px;font-weight:400}
.hero h2 span{color:#111}
.hero p{margin:0;font-size:13px;line-height:1.35}
.hero .pic{flex:1;position:relative;background:radial-gradient(circle at 70% 30%,#8a5f43,#2a1a10);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%,24% 48%,10% 48%)}
.cup{position:absolute;left:44%;top:28px;width:58px;height:80px;background:#f6f1ea;border-radius:6px 6px 14px 14px;display:grid;place-items:center;font-family:'Archivo Black';font-size:14px;color:#111;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.cup:before{content:'';position:absolute;top:-9px;left:-4px;right:-4px;height:12px;background:#fff;border-radius:4px}
.cup b{color:var(--o)}
.hero .blob{position:absolute;right:-20px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--o)}
/* search & cats */
.search{display:flex;align-items:center;gap:10px;background:#F3F3F5;border-radius:28px;padding:13px 18px;margin:16px 0 14px;color:#555}
.search svg{width:22px;height:22px;flex:none}
.search input{border:0;background:transparent;font:15px Inter,sans-serif;flex:1;outline:none;min-width:0}
.xbtn{background:none;border:0;padding:0;color:#888}.xbtn svg{width:18px;height:18px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:64px;background:none;border:0;text-align:center;font-size:11.5px;padding:0;line-height:1.2}
.cat .ic{width:64px;height:64px;border-radius:14px;background:#F5F5F7;display:grid;place-items:center;font-size:30px;border:2px solid transparent;margin-bottom:6px}
.cat.on .ic{border-color:var(--o);background:var(--soft)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.sh h3,h3.h{font-family:'Archivo Black',sans-serif;font-size:20px;margin:0;font-weight:400}
h3.h{margin:24px 0 12px}
.link{background:none;border:0;color:var(--o);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px;padding:0}.link svg{width:18px;height:18px}
.pc{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;margin-bottom:10px;background:#fff;cursor:pointer}
.pc:active{transform:scale(.99)}
.thumb{width:100px;height:78px;border-radius:12px;display:grid;place-items:center;font-size:40px;flex:none}
.thumb.s{width:52px;height:52px;font-size:26px;border-radius:10px}
.pi{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px}
.ds{color:var(--mut);font-size:12.5px;margin:3px 0 7px;line-height:1.3}
.price{color:var(--o);font-weight:800;font-size:15px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;border:0;font-size:28px;line-height:1;display:grid;place-items:center;flex:none;font-weight:300}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.empty .big{font-size:50px;margin-bottom:10px}
/* cart */
.ci{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.ci .thumb{width:84px;height:70px;font-size:34px}
.qty{display:flex;align-items:center;background:#F3F3F5;border-radius:22px;padding:3px}
.qty button{width:30px;height:30px;border:0;background:none;color:var(--o);font-size:21px;line-height:1}
.qty button.dis{color:#bbb}
.qty span{min-width:20px;text-align:center;font-weight:600}
.trash{background:none;border:0;color:#555;padding:4px}.trash svg{width:22px;height:22px}
.addmore{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:14px;border:0;width:100%;text-align:left;margin-top:4px}
.addmore .pl{width:40px;height:40px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.addmore b{color:var(--o);display:block;font-size:15.5px}.addmore small{color:#666}
.addmore > svg{margin-left:auto;color:var(--o);width:22px;height:22px}
.slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.slots::-webkit-scrollbar{display:none}
.slot{flex:none;padding:13px 16px;border-radius:10px;background:#F3F3F5;border:0;font-weight:500;font-size:15px}
.slot.on{background:var(--o);color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;background:#F3F3F5;border-radius:24px;padding:12px 16px;margin:14px 0;color:#777}
.note svg{width:22px;height:22px;flex:none}
.note textarea{border:0;background:transparent;font:14.5px Inter,sans-serif;flex:1;resize:none;outline:none;height:22px}
.payrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;width:100%;text-align:left;margin-bottom:12px}
.payrow svg{width:22px;height:22px;color:var(--o)}.payrow .r{margin-left:auto;color:#999}
.totbox{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px}
.totbox b{font-size:19px}.totbox .big{color:var(--o);font-size:30px;font-weight:800}
.btn{width:100%;border:0;background:var(--o);color:#fff;font-weight:700;font-size:17px;border-radius:32px;padding:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:22px;height:22px}
.btn.ghost{background:var(--soft);color:var(--o);font-size:16px;padding:14px}
.btn.outline{background:#fff;color:var(--o);border:1.5px solid var(--o)}
.btn.dark{background:#111}
.btn+.btn{margin-top:10px}
/* orders */
.seg{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.seg button{flex:1;background:none;border:0;padding:12px 0;color:#888;font-size:16px;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg .on{color:var(--o);border-color:var(--o);font-weight:600}
.oc{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:#fff}
.och{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer}
.och b{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:17px;display:block}
.och small{color:var(--mut);font-size:13.5px}
.pill{padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.prep{background:var(--soft2);color:var(--o)}
.pill.ready{background:var(--o);color:#fff}
.pill.ok{background:var(--gsoft);color:var(--green)}
.pill svg{width:16px;height:16px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.box{background:#F7F7F8;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;border:0;text-align:left;font-size:13px}
.box svg{width:30px;height:30px;color:var(--o);flex:none}
.box .bt{color:#888}
.box b{display:block;color:var(--o);font-size:22px}
.box.st b{color:#111;font-size:14px}
.box.st svg{color:#555}
.ol{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:14px}
.ol .q{color:#555;margin-left:auto;width:30px}.ol .pr{width:58px;text-align:right}
.otot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding:12px 0}
.otot b{font-size:19px}.otot .big{color:var(--o);font-weight:800;font-size:24px}
.past{display:flex;align-items:center;gap:8px;margin-top:12px}
.past .thumb{width:58px;height:52px;font-size:26px}
.pill.btnp{background:#F3F3F5;color:#222;border:0;margin-left:auto;padding:11px 14px;font-size:14px}
/* tracking */
.track h1.t{font-size:30px}
.sub{color:#555;font-size:15.5px;line-height:1.45;margin:-6px 0 6px}
.steps{display:flex;justify-content:space-between;position:relative;margin:22px 0 18px}
.steps:before{content:'';position:absolute;top:31px;left:16.6%;right:16.6%;height:2px;background:#EEE}
.steps .fill{position:absolute;top:31px;left:16.6%;height:2px;background:var(--o);transition:width .4s}
.stp{text-align:center;z-index:1;width:33.3%;font-size:13.5px;line-height:1.5}
.stp .c{width:62px;height:62px;border-radius:50%;background:var(--soft2);color:var(--o);display:grid;place-items:center;margin:0 auto 8px}
.stp .c svg{width:28px;height:28px}
.stp.cur .c{background:var(--o);color:#fff;box-shadow:0 0 0 6px rgba(255,90,10,.12)}
.stp.todo .c{background:#F3F3F3;color:#bbb}.stp.todo{color:#aaa}
.pick{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:18px;padding:16px;border:0;width:100%;text-align:left}
.pick .ic{width:62px;height:62px;border-radius:50%;background:var(--soft2);color:var(--o);display:grid;place-items:center;flex:none}
.pick .ic svg{width:30px;height:30px}
.pick small{color:#777;letter-spacing:1px;font-size:12px}
.pick b{display:block;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:19px;margin:2px 0}
.pick span{color:#777;font-size:13.5px;line-height:1.4;display:block}
.pick > svg{margin-left:auto;width:22px;height:22px;color:#555;flex:none}
.card{border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:#fff}
.tl{display:flex;align-items:center;gap:14px;padding:6px 0}
.tl .pr{margin-left:auto;text-align:right;font-size:15px}.tl .pr small{display:block;color:#777;margin-top:6px}
.tl .nm{font-size:16px}.tl .ds{margin:3px 0 0}
.help{display:block;text-align:center;margin:16px auto 0;background:none;border:0;color:#666;font-size:14px;text-decoration:underline}
/* plus */
.pf{display:flex;gap:16px;align-items:center;background:var(--soft);border-radius:18px;padding:16px;border:0;width:100%;text-align:left}
.av{width:72px;height:72px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-size:26px;flex:none}
.pf b{font-size:17px}.pf span{color:#777;font-size:13.5px;display:block;margin-top:3px}
.pf > svg{margin-left:auto;color:var(--o);width:22px;height:22px;flex:none}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.q{background:var(--soft);border:0;border-radius:14px;padding:14px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#222;line-height:1.2;text-align:center}
.q svg{width:30px;height:30px;color:var(--o)}
.ls{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border:0;width:100%;text-align:left;font-size:15.5px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li > svg{width:24px;height:24px;flex:none}
.li .r{margin-left:auto;color:#888;display:flex;align-items:center;gap:6px;font-size:14px}.li .r svg{width:18px;height:18px;color:#555}
.tg{width:52px;height:30px;border-radius:15px;background:#ddd;position:relative;border:0;flex:none;margin-left:auto;transition:.2s}
.tg.on{background:var(--o)}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on:after{left:25px}
.promo{display:flex;background:var(--soft);border-radius:18px;overflow:hidden;margin-top:18px;min-height:170px;border:0;width:100%;text-align:left;padding:0}
.promo .txt{padding:18px 0 18px 18px;flex:1.15}
.promo small{color:var(--o);font-weight:700;font-size:12.5px}
.promo h4{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:20px;margin:4px 0 8px;line-height:1.15}
.promo p{margin:0 0 12px;color:#666;font-size:13px;line-height:1.35}
.promo .cta{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--o);color:var(--o);border-radius:20px;padding:7px 14px;font-weight:600;font-size:13.5px}
.promo .cta svg{width:16px;height:16px}
.promo .pic{flex:1;background:linear-gradient(135deg,#F3E2CC,#DCC3A2);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%,0 60%,20% 45%,0 35%);display:grid;place-items:center;font-size:62px;position:relative}
/* forms */
.field label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid #E3E3E6;border-radius:12px;padding:13px 14px;font:15px Inter,sans-serif;background:#FAFAFA;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o);background:#fff}
.field textarea{height:120px;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #E3E3E6;background:#fff;border-radius:20px;padding:9px 14px;font-size:14px}
.chip.on{border-color:var(--o);background:var(--soft);color:var(--o);font-weight:600}
.txtp{color:#444;font-size:14.5px;line-height:1.6}
.txtp h4{font-size:16px;margin:18px 0 4px;color:#111}
details{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:'+';color:var(--o);font-size:20px;line-height:1}
details[open] summary:after{content:'–'}
details p{color:#555;font-size:14px;line-height:1.55;margin:10px 0 0}
.scard{background:linear-gradient(135deg,var(--o),#FF8A3D);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;margin-bottom:14px}
.scard:after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.scard small{opacity:.9}.scard .bal{font-size:34px;font-weight:800;margin:6px 0 14px}
.scard button{background:#fff;color:var(--o);border:0;border-radius:20px;padding:9px 16px;font-weight:700;position:relative;z-index:1}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;margin-left:auto;flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--o)}.radio.on:after{content:'';width:11px;height:11px;border-radius:50%;background:var(--o)}
.hours{width:100%;border-collapse:collapse;font-size:14.5px}.hours td{padding:9px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;font-weight:600}
.meter{height:10px;border-radius:5px;background:#F0F0F0;overflow:hidden;margin:8px 0 4px}.meter i{display:block;height:100%;background:var(--o);border-radius:5px}
.open{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;padding:6px 12px;border-radius:20px}
.commit{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.commit .e{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.commit b{display:block;margin-bottom:3px}.commit span{color:#666;font-size:14px;line-height:1.45}
/* overlay */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 20px 30px;max-height:88%;overflow:auto;transform:translateY(100%);transition:transform .26s ease}
.ov.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#DDD;margin:0 auto 14px}
.sheet h2{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;margin:4px 0 6px}
.sheet .mut{color:var(--mut);font-size:14px;line-height:1.45}
.pshero{height:170px;border-radius:20px;display:grid;place-items:center;font-size:84px;position:relative;margin-bottom:14px}
.favb{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:0;color:var(--o);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.favb svg{width:22px;height:22px}
.favb.on svg{fill:var(--o)}
.warn{background:#FFF4E5;color:#A04A00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.prow{display:flex;align-items:center;justify-content:space-between;margin:18px 0}
.qrwrap{display:grid;place-items:center;padding:16px;border:1px solid var(--line);border-radius:20px;margin:16px 0}

/* ---------- order status ---------- */
const OFF=o=>o.fixed?[0,4*6e4,9*6e4]:[0,6e3,16e3];
function stat(o){if(o.picked)return'recup';if(o.fixed)return o.fixed;const e=Date.now()-o.placed;return e<6e3?'cmd':e<16e3?'prep':'ready'}
const SL={cmd:['Commandée','prep'],prep:['En préparation','prep'],ready:['Prête à récupérer','ready'],recup:['Récupérée','ok']};
const pill=o=>{const s=stat(o),[l,c]=SL[s];return `<span class="pill ${c}">${c==='ok'?I.check:'<i></i>'}${l}</span>`};

/* ---------- partials ---------- */
function header(){return `<div class="hdr">
<button class="logo" data-a="tab" data-v="menu" aria-label="Accueil"><div class="icn">icn<span class="dot"></span></div><div class="bs">BUSINESS SCHOOL</div><div class="bars"><i></i><i></i><i></i></div></button>
<div class="brand"><b>ICN CAFÉ</b><span>CLICK &amp; COLLECT</span></div>
<button class="avatar" data-a="push" data-v="info" aria-label="Mon profil">${I.user}</button></div>`}

/* ---------- tab views ---------- */
function vMenu(){
 return header()+`<button class="hero" data-a="how"><div class="txt"><h2>Ta pause.<br>Ton choix.<br><span>Ton timing.</span></h2><p>Commande en ligne.<br>Récupère sans faire la queue.</p></div><div class="pic"><div class="cup">icn<b>.</b></div></div></button>

<div class="cats">${CATS.map(c=>`<button class="cat ${c.id===ui.cat&&!ui.q&&!ui.all?'on':''}" data-a="cat" data-v="${c.id}"><div class="ic">${c.e}</div>${c.n.replace(' ','<br>')}</button>`).join('')}</div>
<div id="plist">${listHTML()}</div>`}
function listHTML(){
 const q=ui.q.trim().toLowerCase();
 if(q){const r=P.filter(p=>(p.n+' '+p.d).toLowerCase().includes(q));
  return `<div class="sh"><h3>Résultats (${r.length})</h3></div>`+(r.length?r.map(pcard).join(''):`<div class="empty"><div class="big">🔍</div>Aucun produit ne correspond à « ${esc(ui.q)} ».</div>`)}
 if(ui.all) return `<div class="sh"><h3>Toute la carte</h3><button class="link" data-a="all">Réduire</button></div>`+CATS.map(c=>`<h3 class="h" style="font-size:16px;margin:18px 0 10px">${c.e} ${c.n}</h3>`+P.filter(p=>p.c===c.id).map(pcard).join('')).join('');
 const c=CATS.find(c=>c.id===ui.cat);
 return `<div class="sh"><h3>${c.n}</h3><button class="link" data-a="all">Voir tout ${I.chev}</button></div>`+P.filter(p=>p.c===ui.cat).map(pcard).join('');
}
function vCart(){

}
function vOrders(){
 let h=header()+`<h1 class="t">Mes commandes</h1><div class="seg">${[['venir','À venir'],['passees','Passées'],['favs','Favoris']].map(([k,l])=>`<button class="${ui.seg===k?'on':''}" data-a="seg" data-v="${k}">${l}</button>`).join('')}</div>`;

  if(!up.length) h+=`<div class="empty"><div class="big">☕</div>Aucune commande en cours.<button class="btn mt" data-a="tab" data-v="menu">Commander maintenant</button></div>`;

  <button class="btn ghost" data-a="qr" data-v="${o.id}">${I.qr} Voir le QR code de retrait ${I.chev}</button></div>`).join('');
  if(past.length) h+=`<h3 class="h" style="font-size:17px">Récemment récupérées</h3>`+past.slice(0,2).map(pastCard).join('');
  return h;
 }

const pastCard=o=>`<div class="oc"><div class="och" data-a="push" data-v="detail:${o.id}"><div><b>Commande #${o.id}</b><small>${dlong(o.placed)}</small></div>${pill(o)}</div>

favs(){const f=P.filter(p=>st.favs.includes(p.id));return header()+backH('Mes favoris')+(f.length?f.map(pcard).join(''):`<div class="empty"><div class="big">🤍</div>Aucun favori. Touche le cœur sur la fiche d'un produit.<button class="btn mt" data-a="tab" data-v="menu">Parcourir le menu</button></div>`)},
faq(){const Q=[['Comment passer commande ?','Choisis tes produits dans l\'onglet Menu, sélectionne un créneau de retrait dans ton panier puis confirme. Tu reçois une notification quand c\'est prêt.'],['Comment récupérer ma commande ?','Présente ton QR code de retrait au comptoir Click & Collect, à côté de l\'entrée principale de la cafétéria.'],['Puis-je modifier ou annuler ?','Tant que la commande n\'est pas en préparation, contacte la cafétéria via « Nous contacter ». Ensuite, elle ne peut plus être modifiée.'],['Quels moyens de paiement ?','Ta carte étudiante ICN (rechargeable dans l\'app), une carte bancaire enregistrée ou Apple Pay.'],['Et si je suis en retard ?','Ta commande est conservée jusqu\'à 30 minutes après ton créneau. Les boissons chaudes peuvent être refaites sur demande.'],['Où trouver les allergènes ?','Sur chaque fiche produit. Indique tes allergènes dans Préférences pour être alerté·e automatiquement.']];
 return header()+backH('FAQ')+Q.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')+`<button class="btn ghost mt" data-a="push" data-v="contact">Je n'ai pas trouvé ma réponse</button>`},

 return header()+backH('Une pause responsable')+`<div class="pshero" style="background:${BG.lunch}">🥗</div>`+C.map(([e,t,d])=>`<div class="commit"><div class="e">${e}</div><div><b>${t}</b><span>${d}</span></div></div>`).join('')+`<div class="mt"></div><button class="btn" data-a="lunch">Découvrir le lunch ${I.arrow}</button>`},

const TABS={menu:vMenu,cart:vCart,orders:vOrders,more:vMore};

/* ---------- render ---------- */
let lastKey='';
function render(){
 const top=st.stack[st.stack.length-1];
 const key=top?top.v+(top.a||''):st.tab;
 const sc=$('#scroll'),keep=key===lastKey?sc.scrollTop:0;
 sc.innerHTML=top?PAGES[top.v](top.a):TABS[st.tab]();
 sc.scrollTop=keep;lastKey=key;
 const tabs=[['menu','Menu',I.menu],['cart','Panier',I.bag],['orders','Commandes',I.receipt],['more','Plus',I.dots]];
 $('#tabbar').innerHTML=tabs.map(([k,l,ic])=>`<button class="tab ${st.tab===k?'on':''}" data-a="tab" data-v="${k}">${ic}${l}${k==='cart'&&st.cart.length?`<span class="badge">${st.cart.length}</span>`:''}</button>`).join('');
 const q=$('#q');if(q)q.oninput=()=>{ui.q=q.value;$('#plist').innerHTML=listHTML();document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('on',!ui.q&&!ui.all&&c.dataset.v===ui.cat))};
 const n=$('#note');if(n)n.oninput=()=>ui.note=n.value;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#ov').classList.add('show')}
function closeSheet(){$('#ov').classList.remove('show');ui.ps=null}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

function qrSVG(s,size=210){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;const r=()=>(h=(Math.imul(h,1103515245)+12345)>>>0)/4294967296;const N=25;let rects='';
 const fz=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!fz(x,y)&&r()<.48)rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return `<svg viewBox="-2 -2 29 29" width="${size}" height="${size}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#111">${rects}${f(0,0)}${f(18,0)}${f(0,18)}</g></svg>`}

/* ---------- product sheet ---------- */
function psHTML(){const {id,sz,q}=ui.ps,p=byId(id),fav=st.favs.includes(id);const bad=p.al.filter(a=>st.prefs.allergens.includes(a));
 return `<div class="pshero" style="background:${BG[p.c]}">${p.e}<button class="favb ${fav?'on':''}" data-a="fav" data-v="${id}" aria-label="Favori">${I.heart}</button></div>
 <h2>${p.n}</h2><p class="mut" style="margin:0">${p.d}</p><p class="mut" style="margin:6px 0 0;font-size:13px">Allergènes : ${p.al.length?p.al.join(', '):'aucun allergène majeur'}</p>
 ${bad.length?`<div class="warn">⚠️ Contient ${bad.join(', ')}, présent dans tes allergènes.</div>`:''}
 ${p.sz?`<h3 class="h" style="font-size:15px;margin:18px 0 8px">Taille</h3><div class="chips">${SIZES.map(([s,d])=>`<button class="chip ${s===sz?'on':''}" data-a="psz" data-v="${s}">${s}${d?` (${d>0?'+':''}${fmt(d)})`:''}</button>`).join('')}</div>`:''}
 <div class="prow"><span class="price" style="font-size:22px">${fmt(unit(p,sz)*q)}</span><div class="qty"><button class="${q<2?'dis':''}" data-a="psq" data-v="-1">−</button><span>${q}</span><button data-a="psq" data-v="1">+</button></div></div>
 <button class="btn" data-a="psadd">Ajouter au panier</button>`}
function addToCart(id,sz,q=1){const p=byId(id);sz=p.sz?(sz||'M'):null;const ex=st.cart.find(l=>l.id===id&&l.sz===sz);if(ex)ex.q+=q;else st.cart.push({id,sz,q});save();render();toast(`${p.n} ajouté au panier ✓`)}

/* ---------- actions ---------- */
const A={
 tab(v){st.tab=v;st.stack=[];if(v==='menu'){ui.all=false}closeSheet();save();render();$('#scroll').scrollTop=0},
 push(v){const i=v.indexOf(':');st.stack.push(i>0?{v:v.slice(0,i),a:v.slice(i+1)}:{v});closeSheet();render()},
 pop(){st.stack.pop();render()},
 cat(v){ui.cat=v;ui.q='';ui.all=false;render()},
 all(){ui.all=!ui.all;ui.q='';render()},
 clearq(){ui.q='';render()},
 how(){sheet(`<h2>Comment ça marche ?</h2>${[['Choisis','Compose ta commande depuis le menu.'],['Planifie','Sélectionne ton créneau de retrait.'],['Récupère','Présente ton QR code au comptoir — sans faire la queue.']].map(([t,d],i)=>`<div class="howstep"><span class="n">${i+1}</span><div><b>${t}</b><div class="mut">${d}</div></div></div>`).join('')}<div class="mt"></div><button class="btn" data-a="close">C'est parti !</button>`)},
 close:closeSheet,
 product(v){ui.ps={id:v,sz:byId(v).sz?'M':null,q:1};sheet(psHTML())},
 add(v){addToCart(v)},
 fav(v){const i=st.favs.indexOf(v);if(i>=0){st.favs.splice(i,1);toast('Retiré des favoris')}else{st.favs.push(v);toast('Ajouté aux favoris ❤️')}save();if(ui.ps){$('#sheet').innerHTML='<div class="grab"></div>'+psHTML()}render()},
 psz(v){ui.ps.sz=v;$('#sheet').innerHTML='<div class="grab"></div>'+psHTML()},
 psq(v){ui.ps.q=Math.max(1,ui.ps.q+(+v));$('#sheet').innerHTML='<div class="grab"></div>'+psHTML()},
 psadd(){const {id,sz,q}=ui.ps;closeSheet();addToCart(id,sz,q)},
 cq(v){const [i,d]=v.split('|').map(Number);st.cart[i].q=Math.max(1,st.cart[i].q+d);save();render()},
 cdel(v){const l=st.cart.splice(+v,1)[0];save();render();toast(`${byId(l.id).n} retiré du panier`)},
 slot(v){ui.slot=v;render()},
 confirm(){const tot=sum(st.cart);
  if(st.pay.sel==='card'&&st.pay.balance<tot){toast('Solde insuffisant — recharge ta carte étudiante');A.push('payments');return}
  if(st.pay.sel==='card')st.pay.balance=Math.round((st.pay.balance-tot)*100)/100;
  const id='ICN-0'+(st.seq++);st.orders.unshift({id,items:st.cart.map(l=>({...l})),slot:ui.slot,note:ui.note.trim(),placed:Date.now(),pay:st.pay.sel});
  st.cart=[];ui.note='';st.tab='orders';ui.seg='venir';st.stack=[{v:'track',a:id}];save();render();$('#scroll').scrollTop=0;toast('Commande confirmée !')},
 seg(v){ui.seg=v;render()},
 qr(v){const o=st.orders.find(x=>x.id===v),s=stat(o);
  sheet(`<h2>QR code de retrait</h2><p class="mut" style="margin:0">Commande #${o.id} · Retrait à ${o.slot}</p><div class="qrwrap">${qrSVG(o.id)}<div style="margin-top:10px;font-weight:700;letter-spacing:2px">#${o.id}</div></div>
  <p class="mut" style="text-align:center">Présente ce code au comptoir Click &amp; Collect.</p>
  ${s==='ready'||(o.fixed&&s!=='recup')?`<button class="btn" data-a="pickup" data-v="${o.id}">Simuler le scan au comptoir</button>`:s==='recup'?`<p style="text-align:center;color:var(--green);font-weight:600">✓ Commande déjà récupérée</p>`:`<p style="text-align:center;color:var(--o);font-weight:600">Ta commande est encore en préparation…</p>`}
  <button class="btn outline" data-a="close">Fermer</button>`)},
 pickup(v){const o=st.orders.find(x=>x.id===v);o.picked=Date.now();save();closeSheet();render();toast('Commande récupérée — bon appétit ! 😋')},
 reorder(v){const o=st.orders.find(x=>x.id===v);o.items.forEach(l=>{const ex=st.cart.find(c=>c.id===l.id&&c.sz===(l.sz||null));if(ex)ex.q+=l.q;else st.cart.push({id:l.id,sz:l.sz||null,q:l.q})});save();A.tab('cart');toast('Articles ajoutés au panier')},
 receipt(v){const o=st.orders.find(x=>x.id===v);sheet(`<h2>Reçu</h2><p class="mut" style="margin:0">ICN Café · Cafétéria ICN, Campus Nancy<br>${dlong(o.placed)} · ${hhmm(o.placed)}</p><div class="card mt">${o.items.map(l=>`<div class="ol"><span>${l.q} × ${byId(l.id).n}${l.sz?' ('+l.sz+')':''}</span><span class="pr" style="margin-left:auto">${fmt(lineTotal(l))}</span></div>`).join('')}<div class="otot"><b>Total TTC</b><b>${fmt(sum(o.items))}</b></div><div class="mut">Dont TVA 5,5 % : ${fmt(sum(o.items)-sum(o.items)/1.055)}<br>Payé avec : ${PAYS[o.pay]||o.pay}</div></div><div class="mt"></div><button class="btn" data-a="close">Fermer</button>`)},
 myqr(){sheet(`<h2>Mon QR code</h2><p class="mut" style="margin:0">À présenter en caisse pour payer avec ta carte étudiante ou cumuler tes points.</p><div class="qrwrap">${qrSVG('etu-'+st.user.first+st.user.last)}<div style="margin-top:10px;font-weight:700">${esc(st.user.first+' '+st.user.last)}</div><div class="mut">${esc(st.user.prog)}</div></div><button class="btn outline" data-a="close">Fermer</button>`)},
 notif(){st.prefs.notif=!st.prefs.notif;save();render();toast(st.prefs.notif?'Notifications activées 🔔':'Notifications désactivées')},
 lang(){sheet(`<h2>Langue</h2><div class="ls mt">${['Français','English','Español','Deutsch'].map(l=>`<button class="li" data-a="setlang" data-v="${l}">${l}<span class="radio ${st.prefs.lang===l?'on':''}"></span></button>`).join('')}</div><p class="mut">Démo : l'interface reste en français.</p>`)},
 setlang(v){st.prefs.lang=v;save();closeSheet();render();toast('Langue : '+v)},
 saveinfo(){const g=id=>$('#'+id).value.trim();if(!g('f_first')||!g('f_last')){toast('Prénom et nom sont obligatoires');return}
  Object.assign(st.user,{first:g('f_first'),last:g('f_last'),email:g('f_email'),phone:g('f_phone'),prog:g('f_prog')});save();st.stack.pop();render();toast('Informations enregistrées ✓')},
 slotpref(v){st.prefs.slot=v;ui.slot=v;save();render();toast('Créneau favori : '+v)},
 allergen(v){const a=st.prefs.allergens,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);save();render()},
 reset(){if(confirm('Réinitialiser toutes les données de démonstration ?')){st=seed();st.tab='menu';st.stack=[];ui.slot=st.prefs.slot;save();render();toast('Application réinitialisée')}},
 reload(){sheet(`<h2>Recharger ma carte</h2><p class="mut" style="margin:0">Solde actuel : ${fmt(st.pay.balance)}</p><div class="chips mt">${[10,20,30,50].map(m=>`<button class="chip" style="flex:1;padding:16px;font-weight:700" data-a="doreload" data-v="${m}">+${m} €</button>`).join('')}</div><p class="mut">Démo : aucun paiement réel n'est effectué.</p>`)},
 doreload(v){st.pay.balance+=+v;save();closeSheet();render();toast(`Carte rechargée de ${v} € ✓`)},
 paysel(v){st.pay.sel=v;save();render();toast('Paiement par défaut : '+PAYS[v])},
 addpay(){sheet(`<h2>Ajouter un moyen de paiement</h2><p class="mut">L'ajout d'une carte bancaire se fait via le portail de paiement sécurisé de l'école. Dans cette démo, tu peux utiliser la carte étudiante, la Visa enregistrée ou Apple Pay.</p><button class="btn" data-a="close">Compris</button>`)},
 contactsend(){if(!$('#c_msg').value.trim()){toast('Écris ton message avant d\'envoyer');return}st.stack.pop();render();toast('Message envoyé à la cafétéria ✓')},
 lunch(){st.tab='menu';st.stack=[];ui.cat='lunch';ui.q='';ui.all=false;render();$('#scroll').scrollTop=330},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v)}});

/* ---------- live updates ---------- */
let sig='';
setInterval(()=>{
 $('#clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'numeric',minute:'2-digit'});
 const s=st.orders.map(o=>o.id+stat(o)).join();
 if(sig&&s!==sig){
  const ready=st.orders.find(o=>!o.picked&&!o.fixed&&stat(o)==='ready'&&!o.notified);
  if(ready){ready.notified=1;save();if(st.prefs.notif)toast(`🔔 Ta commande #${ready.id} est prête !`)}
  const top=st.stack[st.stack.length-1];
  if((top&&top.v==='track')||(!top&&st.tab==='orders'))render();
 }
 sig=s;
},1000);
render();
</script>
</body>
</html>
